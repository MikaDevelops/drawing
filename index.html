<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="style.css">
        <title>Somekind of drawing app</title>
    </head>
    <body>
        <canvas id="main_canvas"></canvas>
        
        <div id="toolBox"></div>
            <select id="tools" onchange="changeTool(this.value);">
                <option value="path" selected>Path</option>
                <option value="rectangle">Rectangle</option>
            </select>
            <div id="color_picker">
            <input type="color" id="lineColor" value="#aa0000" title="line color" /><br>
            <input type="checkbox" id="strokeChecked" name="strokeChecked" title="Stroke" checked /><label for="strokeChecked">Stroke</label><br>
            <input type="color" id="fillColor" value="#00aa00" title="fill color" /><br>
            <input type="checkbox" id="fillChecked" name="fillChecked" title="Fill" /><label for="fillChecked">Fill</label>
            </div>
        </div>

        <script src="./shapes/shape.js"></script>
        <script src="./shapes/rectangle.js"></script>
        <script src="./shapes/path.js"></script>
        <script src="script.js"></script>
    </body>
</html>
